<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CARROM // NOKIA EDITION</title>
  <style>
    :root { --ink:#193637; --lcd:#afc9a8; --paper:#f0dca9; --wood:#5a321e; --edge:#29170f; --accent:#b93423; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#d9d3c4; color:var(--ink); font-family:"Courier New", monospace; display:grid; place-items:center; padding:18px; }
    .phone { width:min(100%, 540px); border:9px solid #263535; border-radius:32px; background:linear-gradient(135deg,#607175,#405154); box-shadow:0 17px 0 #2d383a, 0 30px 45px #5558; padding:18px 15px 23px; }
    .brand { text-align:center; color:#e8e8d7; letter-spacing:4px; font-weight:bold; font-size:13px; margin:2px 0 14px; }
    .screen { border:7px solid #273638; border-radius:12px; background:var(--lcd); padding:10px; box-shadow:inset 0 0 0 3px #789275; }
    .top { display:flex; justify-content:space-between; font-weight:bold; font-size:11px; margin-bottom:7px; }
    h1 { font-size:18px; letter-spacing:2px; text-align:center; margin:4px 0 8px; }
    canvas { width:100%; aspect-ratio:1; display:block; background:var(--paper); border:4px solid #57745d; image-rendering:pixelated; touch-action:none; }
    .message { min-height:22px; text-align:center; font-size:12px; font-weight:bold; padding-top:7px; }
    .keys { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:9px; margin:19px 8px 4px; }
    button { border:0; border-radius:16px; min-height:43px; background:#9eada8; color:#172728; font:700 11px "Courier New",monospace; box-shadow:inset 0 -4px #687a78, 0 3px #263536; cursor:pointer; }
    button:active { transform:translateY(2px); box-shadow:inset 0 -2px #687a78, 0 1px #263536; }
    .center { background:#cbd3c9; border-radius:22px; }
    .help { margin:13px 6px 0; text-align:center; color:#e7e7d8; font-size:10px; line-height:1.5; }
    .legend { display:flex; justify-content:space-around; font-size:10px; font-weight:bold; padding:6px 2px 0; }
    @media (max-width:420px) { body { padding:8px; } .phone { padding:12px 9px 18px; border-width:7px; border-radius:24px; } }
  </style>
</head>
<body>
  <main class="phone">
    <div class="brand">NOKIA</div>
    <section class="screen">
      <div class="top"><span id="p1">P1 000</span><span id="turn">P1 TURN</span><span id="p2">P2 000</span></div>
      <h1>POCKET MASTER</h1>
      <canvas id="board" width="600" height="600" aria-label="Carrom board"></canvas>
      <div class="legend"><span>P1 ● BLACK ×9</span><span>P2 ● WHITE ×9</span><span>● RED ×1</span></div>
      <div class="message" id="message">DRAG STRIKER TO AIM</div>
    </section>
    <div class="keys"><button id="reset">CLEAR<br>NEW GAME</button><button class="center" id="shoot">FIRE<br>STRIKER</button><button id="sound">SOUND<br>ON</button></div>
    <p class="help" id="help">YOU ARE P1 (BLACK). MOVE ON THE BOTTOM DOTS.<br>PULL DOWN, THEN RELEASE TO SHOOT UP.</p>
  </main>
<script>
(() => {
  const canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
  const ui={p1:document.getElementById('p1'),p2:document.getElementById('p2'),turn:document.getElementById('turn'),message:document.getElementById('message'),help:document.getElementById('help')};
  const S=600, EDGE=42, POCKET_RADIUS=30, POCKET_HIT=25, COIN_R=15, STRIKER_R=20, BASE_BOTTOM=516, BASE_TOP=84, STEP=1/60, DAMPING=.985, STOP_SPEED=.1, MAX_SHOT=14;
  const pockets=[[EDGE,EDGE],[S-EDGE,EDGE],[EDGE,S-EDGE],[S-EDGE,S-EDGE]];
  let pieces=[], striker, current=0, players, matchScores=[0,0], drag=null, inShot=false, boardFinished=false, shot, queenState='BOARD_CENTER', queenOwner=null, sound=true, audio, accumulator=0, previous=performance.now(), aiTimer=0;
  const playerName=()=>current===0?'P1':'P2';
  const baselineY=()=>current===0?BASE_BOTTOM:BASE_TOP;
  const ownColor=()=>players[current].color;
  const makePiece=(x,y,r,mass,color,kind)=>({x,y,vx:0,vy:0,r,mass,color,kind,dead:false});
  const tone=(hz=220,duration=.045)=>{if(!sound)return;try{audio??=new AudioContext();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=hz;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch{}};
  function startBoard(preserveMatch=true){
    clearTimeout(aiTimer); if(!preserveMatch)matchScores=[0,0]; current=0; drag=null; inShot=false; boardFinished=false; queenState='BOARD_CENTER'; queenOwner=null; players=[{color:null,captured:[]},{color:null,captured:[]}]; pieces=[];
    pieces.push(makePiece(300,300,COIN_R,1,'#b52d25','queen'));
    const addRing=(count,radius,start)=>{for(let i=0;i<count;i++){const a=start+i*Math.PI*2/count;const kind=i%2?'white':'black';pieces.push(makePiece(300+Math.cos(a)*radius,300+Math.sin(a)*radius,COIN_R,1,kind==='white'?'#f6f0dc':'#20201c',kind));}};
    addRing(6,31,0); addRing(12,62,Math.PI/12);
    striker=makePiece(300,BASE_BOTTOM,STRIKER_R,3,'#d7ad54','striker'); updateUI(); say('P1: PLACE THE STRIKER, PULL DOWN, RELEASE.'); draw();
  }
  function updateUI(){
    const label=i=>players[i].color?players[i].color[0].toUpperCase()+players[i].color.slice(1):'—';
    ui.p1.textContent=`P1 ${String(matchScores[0]).padStart(2,'0')} (${players[0].captured.length}/9) ${label(0)}`;
    ui.p2.textContent=`P2 ${String(matchScores[1]).padStart(2,'0')} (${players[1].captured.length}/9) ${label(1)}`;
    ui.turn.textContent=`${playerName()} ${current===0?'TURN':'AI'}`;
    ui.help.innerHTML=current===0?'YOU ARE P1. PLACE ON THE BOTTOM LINE.<br>PULL DOWN TO AIM, THEN RELEASE TO SHOOT.':'P2 IS PLAYING FROM THE TOP LINE…<br>POCKET YOUR COLOUR TO KEEP THE TURN.';
  }
  const say=text=>ui.message.textContent=text;
  function drawBoard(){
    ctx.clearRect(0,0,S,S);let g=ctx.createLinearGradient(0,0,S,S);g.addColorStop(0,'#3c1e13');g.addColorStop(.5,'#81502e');g.addColorStop(1,'#30180f');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);ctx.fillStyle='#b87a43';ctx.fillRect(15,15,570,570);ctx.fillStyle='#55301d';ctx.fillRect(25,25,550,550);
    g=ctx.createLinearGradient(EDGE,EDGE,S-EDGE,S-EDGE);g.addColorStop(0,'#f7e8bf');g.addColorStop(.6,'#ecd19a');g.addColorStop(1,'#e5c68b');ctx.fillStyle=g;ctx.fillRect(EDGE,EDGE,S-EDGE*2,S-EDGE*2);ctx.strokeStyle='#8b522c';ctx.lineWidth=4;ctx.strokeRect(EDGE,EDGE,S-EDGE*2,S-EDGE*2);
    pockets.forEach(([px,py])=>{ctx.beginPath();ctx.fillStyle='#20120f';ctx.arc(px,py,POCKET_RADIUS,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.strokeStyle='#dfb568';ctx.lineWidth=4;ctx.arc(px,py,POCKET_RADIUS+9,0,Math.PI*2);ctx.stroke();});
    ctx.strokeStyle='#9e6032';ctx.lineWidth=2;[65,53].forEach(r=>{ctx.beginPath();ctx.arc(300,300,r,0,Math.PI*2);ctx.stroke();});
    [BASE_TOP,BASE_BOTTOM].forEach(y=>{ctx.beginPath();ctx.moveTo(123,y);ctx.lineTo(477,y);ctx.stroke();ctx.beginPath();ctx.arc(300,y,42,0,Math.PI*2);ctx.stroke();});
    [[119,BASE_TOP],[481,BASE_TOP],[119,BASE_BOTTOM],[481,BASE_BOTTOM],[196,BASE_BOTTOM],[252,BASE_BOTTOM],[348,BASE_BOTTOM],[404,BASE_BOTTOM]].forEach(([px,py])=>{ctx.beginPath();ctx.fillStyle='#7b271e';ctx.arc(px,py,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle='#f7dfa0';ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();});
  }
  function drawPiece(p){ctx.beginPath();ctx.fillStyle='#5c3821';ctx.arc(p.x+3,p.y+4,p.r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle=p.color;ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.strokeStyle=p.kind==='white'?'#b5a98d':'#574334';ctx.lineWidth=2;ctx.arc(p.x,p.y,p.r-3,0,Math.PI*2);ctx.stroke();if(p.kind==='queen'){ctx.fillStyle='#ffd37a';ctx.fillRect(p.x-3,p.y-3,6,6);}}
  function drawAim(){if(inShot||current!==0)return;const target=drag??{x:striker.x,y:700},dx=striker.x-target.x,dy=striker.y-target.y,d=Math.hypot(dx,dy)||1;ctx.save();ctx.globalAlpha=drag?1:.4;ctx.setLineDash([7,8]);ctx.strokeStyle='#2b524a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(striker.x,striker.y);ctx.lineTo(striker.x+dx/d*310,striker.y+dy/d*310);ctx.stroke();ctx.restore();if(drag){const p=Math.min(1,d/44);ctx.fillStyle='#2b524a';ctx.fillRect(244,555,112,8);ctx.fillStyle='#e85032';ctx.fillRect(246,557,p*108,4);}}
  function draw(){drawBoard();pieces.filter(p=>!p.dead).forEach(drawPiece);if(!striker.dead)drawPiece(striker);drawAim();}
  function assignColors(kind){if(players[0].color||!['white','black'].includes(kind))return;players[current].color=kind;players[1-current].color=kind==='white'?'black':'white';say(`${playerName()} IS ${kind.toUpperCase()} — POCKET YOUR COLOUR.`);updateUI();}
  function returnCapturedPiece(player){const p=players[player].captured.pop();if(!p)return;p.dead=false;p.vx=p.vy=0;p.x=300;p.y=300;while(pieces.some(other=>other!==p&&!other.dead&&Math.hypot(p.x-other.x,p.y-other.y)<31))p.y+=18;}
  function respawnQueen(){const q=pieces.find(p=>p.kind==='queen');if(!q)return;q.dead=false;q.vx=q.vy=0;q.x=300;q.y=300;}
  function pocket(p){
    if(p.dead)return; p.dead=true;
    if(p.kind==='striker'){shot.strikerPocketed=true;shot.foul=true;say('STRIKER FOUL — TURN WILL PASS.');tone(120,.1);return;}
    if(p.kind==='queen'){shot.queen=true;queenState='POCKETED_UNCOVERED';queenOwner=current;say(`${playerName()} POCKETED THE QUEEN — COVER IT NEXT SHOT.`);tone(680,.12);return;}
    assignColors(p.kind);const own=ownColor()===p.kind;
    if(own){shot.own=true;players[current].captured.push(p);say(`${playerName()} POCKET! PLAY AGAIN.`);tone(560,.1);}else{shot.opponent=true;say('OPPONENT COIN POCKETED — TURN PASSES.');tone(180,.08);}updateUI();
  }
  function checkPockets(p){for(const [px,py] of pockets)if((p.x-px)**2+(p.y-py)**2<POCKET_HIT**2){pocket(p);return;}}
  function wallCollision(p){const lo=EDGE+p.r,hi=S-EDGE-p.r;if(p.x<lo){p.x=lo;p.vx=-p.vx;}else if(p.x>hi){p.x=hi;p.vx=-p.vx;}if(p.y<lo){p.y=lo;p.vy=-p.vy;}else if(p.y>hi){p.y=hi;p.vy=-p.vy;}}
  function collide(a,b){const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,ds=dx*dx+dy*dy;if(ds>=rr*rr)return;const d=Math.sqrt(ds)||.001,nx=dx/d,ny=dy/d,overlap=rr-d,totalInv=1/a.mass+1/b.mass;a.x-=nx*overlap*(1/a.mass)/totalInv;a.y-=ny*overlap*(1/a.mass)/totalInv;b.x+=nx*overlap*(1/b.mass)/totalInv;b.y+=ny*overlap*(1/b.mass)/totalInv;const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative>=0)return;const impulse=-(2*relative)/totalInv;a.vx-=impulse*nx/a.mass;a.vy-=impulse*ny/a.mass;b.vx+=impulse*nx/b.mass;b.vy+=impulse*ny/b.mass;tone(120+Math.min(280,Math.abs(impulse)*70),.025);}
  function allBodies(){return [...pieces.filter(p=>!p.dead),striker].filter(p=>!p.dead);}
  function stepPhysics(){const bodies=allBodies();for(const p of bodies){p.x+=p.vx;p.y+=p.vy;if(p.x-p.r<0||p.x+p.r>S||p.y-p.r<0||p.y+p.r>S)shot.outOfBounds=true;p.vx*=DAMPING;p.vy*=DAMPING;if(Math.hypot(p.vx,p.vy)<STOP_SPEED)p.vx=p.vy=0;checkPockets(p);if(!p.dead)wallCollision(p);}for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++)if(!bodies[i].dead&&!bodies[j].dead)collide(bodies[i],bodies[j]);if(inShot&&!allBodies().some(p=>p.vx||p.vy))finishTurn();}
  function beginShot(vx,vy,message){if(inShot||boardFinished)return;drag=null;const backwards=current===0?vy>0:vy<0;shot={own:false,opponent:false,queen:false,strikerPocketed:false,outOfBounds:false,strikerShotFlickedBackward:backwards,foul:backwards,coverAttempt:queenState==='POCKETED_UNCOVERED'&&queenOwner===current};striker.vx=vx;striker.vy=vy;inShot=true;say(message);tone(290,.07);}
  const remainingFor=player=>players[player].color?pieces.filter(p=>!p.dead&&p.kind===players[player].color).length:9;
  function endBoard(winner,reason){boardFinished=true;inShot=false;const base=remainingFor(1-winner),queenBonus=queenState==='PERMANENTLY_COVERED'&&queenOwner===winner?3:0,points=base+queenBonus;matchScores[winner]+=points;updateUI();say(matchScores[winner]>=21?`P${winner+1} WINS THE MATCH — ${matchScores[winner]} POINTS!`:`${reason} P${winner+1} WINS THE BOARD +${points}. NEW BOARD TO CONTINUE.`);draw();}
  function checkBoardEnd(){for(let i=0;i<2;i++)if(players[i].color&&remainingFor(i)===0){if(queenState!=='PERMANENTLY_COVERED'){endBoard(1-i,`P${i+1} CLEARED THEIR COLOUR BEFORE QUEEN COVER.`);}else endBoard(i,'BOARD COMPLETE.');return true;}return false;}
  function finishTurn(){
    inShot=false;striker.dead=false;striker.vx=striker.vy=0;shot.foul=shot.foul||shot.strikerPocketed||shot.outOfBounds||shot.strikerShotFlickedBackward;
    let keep=shot.own&&!shot.opponent&&!shot.foul;
    if(shot.coverAttempt){if(shot.own&&!shot.foul){queenState='PERMANENTLY_COVERED';keep=true;say(`${playerName()} COVERED THE QUEEN!`);}else{respawnQueen();queenState='BOARD_CENTER';queenOwner=null;keep=false;say('QUEEN NOT COVERED — RETURNED TO CENTRE.');}}
    else if(shot.queen)keep=!shot.foul;
    if(shot.foul){returnCapturedPiece(current);keep=false;say('FOUL: STRIKER/BOUNDARY/BACKWARD SHOT — PIECE RETURNED.');}
    if(checkBoardEnd())return;if(!keep)current=1-current;striker.x=300;striker.y=baselineY();updateUI();draw();
    if(current===1){say('P2 IS AIMING…');clearTimeout(aiTimer);aiTimer=setTimeout(aiTurn,650);}else if(keep)say('P1 SCORED — PLAY AGAIN.');else say('P1 — AIM AND SHOOT.');
  }
  function aiTurn(){if(inShot||current!==1)return;const targetColor=ownColor()??'black';const options=pieces.filter(p=>!p.dead&&(p.kind===targetColor||p.kind==='queen'));if(!options.length){current=0;striker.y=baselineY();updateUI();draw();return;}const target=options.reduce((best,p)=>p.y>best.y?p:best,options[0]);striker.x=Math.max(135,Math.min(465,target.x));striker.y=BASE_TOP;const dx=target.x-striker.x,dy=target.y-striker.y,d=Math.hypot(dx,dy)||1,power=Math.min(MAX_SHOT,7+d/55);beginShot(dx/d*power,dy/d*power,'P2 STRIKER AWAY!');}
  function eventPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height};}
  canvas.addEventListener('pointerdown',e=>{if(current!==0||inShot)return;const p=eventPos(e);if(p.y<450)return;striker.x=Math.max(130,Math.min(470,p.x));striker.y=BASE_BOTTOM;drag={x:p.x,y:p.y};canvas.setPointerCapture(e.pointerId);say('PULL BELOW THE STRIKER TO SET POWER.');draw();});
  canvas.addEventListener('pointermove',e=>{if(!drag||inShot)return;const p=eventPos(e);if(p.y>450&&Math.abs(p.x-striker.x)>14){striker.x=Math.max(130,Math.min(470,p.x));drag={x:striker.x,y:p.y};}else drag=p;draw();});
  canvas.addEventListener('pointerup',e=>{if(!drag||inShot)return;const p=eventPos(e),dx=striker.x-p.x,dy=striker.y-p.y;drag=null;if(dy>=-5){say('PULL BELOW THE STRIKER TO SHOOT.');draw();return;}const d=Math.hypot(dx,dy),power=Math.min(MAX_SHOT,d*.32);if(power<.5)return;beginShot(dx/d*power,dy/d*power,'P1 STRIKER AWAY!');});
  document.getElementById('reset').onclick=()=>startBoard(true);document.getElementById('shoot').onclick=()=>{if(current===0&&!inShot)beginShot(0,-10,'P1 STRAIGHT SHOT!');};document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.innerHTML='SOUND<br>'+(sound?'ON':'OFF');};
  function loop(now){accumulator+=Math.min(.1,(now-previous)/1000);previous=now;while(accumulator>=STEP){if(inShot)stepPhysics();accumulator-=STEP;}draw();requestAnimationFrame(loop);}startBoard(false);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
